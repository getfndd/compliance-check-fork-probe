name: compliance-check fork probe

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: preset-ai/compliance-check@v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          design-system-id: '00000000-0000-4000-8000-000000000000'
          preset-api-key: ${{ secrets.PRESET_API_KEY }}
          include: 'src/**'
